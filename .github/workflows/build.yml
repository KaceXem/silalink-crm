name: Build SilaLink Desktop

on:
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview requests appdirs

      - name: Compilation avec PyInstaller
        run: |
          pyinstaller --noconsole --onefile --icon=silalink.ico hub_launcher.pyw

      - name: Sauvegarde de l'exécutable
        uses: actions/upload-artifact@v4
        with:
          name: SilaLink-Executable
          path: dist/hub_launcher.exe